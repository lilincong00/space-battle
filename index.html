            obstacles = [];
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            // 在地图中央区域生成一些障碍物
            const count = 4 + Math.floor(Math.random() * 3);
            let attempts = 0;
            while (obstacles.length < count && attempts < 200) {
                attempts++;
                const type = Math.random() < 0.6 ? 'wall' : 'trap';
                const w = type === 'wall' ? 50 + Math.random() * 40 : 60 + Math.random() * 50;
                const h = type === 'wall' ? 50 + Math.random() * 40 : 40 + Math.random() * 30;
                // 分布在中间区域，但给两边留出通道
                const x = cx - 150 + Math.random() * 300 - w / 2;
                const y = 80 + Math.random() * (canvas.height - 160) - h / 2;

                // 确保不与玩家出生点太近
                const distToP1 = Math.sqrt(Math.pow(x + w / 2 - canvas.width * 0.2, 2) + Math.pow(y + h / 2 - cy, 2));
                const distToP2 = Math.sqrt(Math.pow(x + w / 2 - canvas.width * 0.8, 2) + Math.pow(y + h / 2 - cy, 2));
                if (distToP1 <= 120 || distToP2 <= 120) continue;

                // 确保不与已有障碍物重叠（留20像素间隙）
                let overlaps = false;
                const gap = 20;
                for (let obs of obstacles) {
                    if (x < obs.x + obs.width + gap &&
                        x + w + gap > obs.x &&
                        y < obs.y + obs.height + gap &&
                        y + h + gap > obs.y) {
                        overlaps = true;
                        break;
                    }
                }
                if (overlaps) continue;

                obstacles.push(new Obstacle(x, y, w, h, type));
            }
        }

        function initGame() {
            player1 = new Player(canvas.width * 0.2, canvas.height / 2, '#ff4444', true);
            player2 = new Player(canvas.width * 0.8, canvas.height / 2, '#4444ff', false);
            explosions = [];
            healEffects = [];
            powerUps = [];
            powerUpSpawnTimer = 0;
            generateObstacles();
        }

        // 矩形碰撞检测
        function rectCollision(r1, r2) {
            return r1.x < r2.x + r2.width &&
                   r1.x + r1.width > r2.x &&
                   r1.y < r2.y + r2.height &&
                   r1.y + r1.height > r2.y;
        }

        // 圆形与矩形碰撞检测（用于子弹和道具）
        function circleRectCollision(cx, cy, cr, rx, ry, rw, rh) {
            const closestX = Math.max(rx, Math.min(cx, rx + rw));
            const closestY = Math.max(ry, Math.min(cy, ry + rh));
            const dx = cx - closestX;
            const dy = cy - closestY;
            return (dx * dx + dy * dy) < (cr * cr);
        }

        // 处理玩家与固体障碍物的碰撞（推动玩家）
        function resolvePlayerObstacleCollision(player) {
            for (let obs of obstacles) {
                if (obs.type !== 'wall' || obs.health <= 0) continue;
                // 简化为圆形碰撞体（玩家半径约38）
                if (circleRectCollision(player.x, player.y, 33, obs.x, obs.y, obs.width, obs.height)) {
                    // 计算碰撞方向，将玩家推出
                    const cx = obs.x + obs.width / 2;
                    const cy = obs.y + obs.height / 2;
                    const dx = player.x - cx;
                    const dy = player.y - cy;
                    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                    const pushX = (dx / dist) * 3;
                    const pushY = (dy / dist) * 3;
                    player.x += pushX;
                    player.y += pushY;
                }
            }
        }

        function updateHealthBars() {
            document.getElementById('health1').style.width = player1.health + '%';
            document.getElementById('health2').style.width = player2.health + '%';
        }

        let trapDamageTimer = 0;

        function checkCollisions() {
            // === 子弹 vs 障碍物 ===
            [player1, player2].forEach(player => {
                for (let i = player.bullets.length - 1; i >= 0; i--) {
                    const b = player.bullets[i];
                    const bulletRadius = b.isLaser ? 12 : 8;
                    let hitObstacle = false;
                    for (let obs of obstacles) {
                        if (obs.health <= 0) continue;
                        if (circleRectCollision(b.x, b.y, bulletRadius, obs.x, obs.y, obs.width, obs.height)) {
                            if (obs.type === 'wall') {
                                obs.takeDamage(b.damage);
                                drawHitEffect(b.x, b.y, '#cc8844');
                                if (obs.health <= 0) {
                                    explosions.push(new Explosion(obs.x + obs.width / 2, obs.y + obs.height / 2, '200, 150, 80'));
                                    playExplosionSound();
                                }
                            }
                            hitObstacle = true;
                            break;
                        }
                    }
                    if (hitObstacle) {
                        player.bullets.splice(i, 1);
                        continue;
                    }
                }
            });

            // === 玩家1的子弹击中玩家2 ===
            for (let i = player1.bullets.length - 1; i >= 0; i--) {
                const b = player1.bullets[i];
                const hitRadius = b.isLaser ? 55 : 45;
                const dx = b.x - player2.x;
                const dy = b.y - player2.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < hitRadius && player2.invincible <= 0) {
                    let actualDamage = b.damage;
                    // 护盾减伤
                    if (player2.shieldActive && player2.shieldHealth > 0) {
                        if (player2.shieldHealth >= actualDamage) {
                            player2.shieldHealth -= actualDamage;
                            actualDamage = 0;
                            // 护盾受击特效
                            drawHitEffect(b.x, b.y, '#33ccff');
                        } else {
                            actualDamage -= player2.shieldHealth;
                            player2.shieldHealth = 0;
                            player2.shieldActive = false;
                            drawHitEffect(b.x, b.y, '#33ccff');
                        }
                    }
                    if (actualDamage > 0) {
                        player2.health -= actualDamage;
                        drawHitEffect(b.x, b.y, '#4488ff');
                        playHitSound();
                        player2.x += 5;
                    }
                    player1.bullets.splice(i, 1);

                    if (player2.health <= 0) {
                        explosions.push(new Explosion(player2.x, player2.y, '255, 150, 50'));
                        roundScores[0]++;
                        document.getElementById('score1').textContent = roundScores[0];
                        endRound(1);
                        return;
                    }
                }
            }

            // === 玩家2的子弹击中玩家1 ===
            for (let i = player2.bullets.length - 1; i >= 0; i--) {
                const b = player2.bullets[i];
                const hitRadius = b.isLaser ? 55 : 45;
                const dx = b.x - player1.x;
                const dy = b.y - player1.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < hitRadius && player1.invincible <= 0) {
                    let actualDamage = b.damage;
                    // 护盾减伤
                    if (player1.shieldActive && player1.shieldHealth > 0) {
                        if (player1.shieldHealth >= actualDamage) {
                            player1.shieldHealth -= actualDamage;
                            actualDamage = 0;
                            drawHitEffect(b.x, b.y, '#33ccff');
                        } else {
                            actualDamage -= player1.shieldHealth;
                            player1.shieldHealth = 0;
                            player1.shieldActive = false;
                            drawHitEffect(b.x, b.y, '#33ccff');
                        }
                    }
                    if (actualDamage > 0) {
                        player1.health -= actualDamage;
                        drawHitEffect(b.x, b.y, '#ff6644');
                        playHitSound();
                        player1.x -= 5;
                    }
                    player2.bullets.splice(i, 1);

                    if (player1.health <= 0) {
                        explosions.push(new Explosion(player1.x, player1.y, '50, 150, 255'));
                        roundScores[1]++;
                        document.getElementById('score2').textContent = roundScores[1];
                        endRound(2);
                        return;
                    }
                }
            }

            // === 导弹碰撞检测 ===
            [player1, player2].forEach((player, idx) => {
                const enemy = idx === 0 ? player2 : player1;
                for (let i = player.missiles.length - 1; i >= 0; i--) {
                    const m = player.missiles[i];
                    const dx = m.x - enemy.x;
                    const dy = m.y - enemy.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 50 && enemy.invincible <= 0) {
                        let actualDamage = m.damage;
                        // 护盾减伤
                        if (enemy.shieldActive && enemy.shieldHealth > 0) {
                            if (enemy.shieldHealth >= actualDamage) {
                                enemy.shieldHealth -= actualDamage;
                                actualDamage = 0;
                                drawHitEffect(m.x, m.y, '#33ccff');
                            } else {
                                actualDamage -= enemy.shieldHealth;
                                enemy.shieldHealth = 0;
                                enemy.shieldActive = false;
                                drawHitEffect(m.x, m.y, '#33ccff');
                            }
                        }
                        if (actualDamage > 0) {
                            enemy.health -= actualDamage;
                            drawHitEffect(m.x, m.y, enemy.isLeft ? '#ff6644' : '#4488ff');
                            playHitSound();
                            explosions.push(new Explosion(m.x, m.y, enemy.isLeft ? '255, 100, 50' : '50, 150, 255'));
                            playExplosionSound();
                        }
                        player.missiles.splice(i, 1);

                        if (enemy.health <= 0) {
                            explosions.push(new Explosion(enemy.x, enemy.y, enemy.isLeft ? '50, 150, 255' : '255, 150, 50'));
                            const winner = enemy.isLeft ? 2 : 1;
                            roundScores[winner - 1]++;
                            document.getElementById(`score${winner}`).textContent = roundScores[winner - 1];
                            endRound(winner);
                            return;
                        }
                    }

                    // 导弹 vs 障碍物
                    for (let obs of obstacles) {
                        if (obs.health <= 0) continue;
                        if (circleRectCollision(m.x, m.y, 10, obs.x, obs.y, obs.width, obs.height)) {
                            if (obs.type === 'wall') {
                                obs.takeDamage(m.damage);
                                drawHitEffect(m.x, m.y, '#cc8844');
                                if (obs.health <= 0) {
                                    explosions.push(new Explosion(obs.x + obs.width / 2, obs.y + obs.height / 2, '200, 150, 80'));
                                    playExplosionSound();
                                }
                            }
                            explosions.push(new Explosion(m.x, m.y, '255, 150, 50'));
                            player.missiles.splice(i, 1);
                            break;
                        }
                    }
                }
            });

            // === 玩家 vs 陷阱（持续伤害）===
            trapDamageTimer++;
            if (trapDamageTimer % 15 === 0) { // 每15帧造成一次伤害
                [player1, player2].forEach(player => {
                    if (player.invincible > 0) return;
                    for (let obs of obstacles) {
                        if (obs.type !== 'trap') continue;
                        if (circleRectCollision(player.x, player.y, 30, obs.x, obs.y, obs.width, obs.height)) {
                            let trapDamage = 5;
                            // 护盾减伤
                            if (player.shieldActive && player.shieldHealth > 0) {
                                if (player.shieldHealth >= trapDamage) {
                                    player.shieldHealth -= trapDamage;
                                    trapDamage = 0;
                                    drawHitEffect(player.x, player.y, '#33ccff');
                                } else {
                                    trapDamage -= player.shieldHealth;
                                    player.shieldHealth = 0;
                                    player.shieldActive = false;
                                    drawHitEffect(player.x, player.y, '#33ccff');
                                }
                            }
                            if (trapDamage > 0) {
                                player.health -= trapDamage;
                                drawHitEffect(player.x, player.y, player.isLeft ? '#ff6644' : '#4488ff');
                            }
                            // 限制陷阱音效频率，避免过于频繁
                            const now = Date.now();
                            if (now - lastTrapSoundTime > 500) {
                                playTrapSound();
                                lastTrapSoundTime = now;
                            }
                            if (player.health <= 0) {
                                const winner = player.isLeft ? 2 : 1;
                                explosions.push(new Explosion(player.x, player.y, player.isLeft ? '50, 150, 255' : '255, 150, 50'));
                                roundScores[winner - 1]++;
                                document.getElementById(`score${winner}`).textContent = roundScores[winner - 1];
                                endRound(winner);
                                return;
                            }
                        }
                    }
                });
            }

            // === 玩家 vs 道具（拾取）===
            for (let i = powerUps.length - 1; i >= 0; i--) {
                const p = powerUps[i];
                if (p.life <= 0 || p.collected) continue;

                function applyPowerUp(player, type) {
                    switch (type) {
                        case 'shotgun':
                            player.shotgunMode = 15;
                            player.shotgunTimer = 600;
                            break;
                        case 'missile':
                            player.missileAmmo += 3;
                            break;
                        case 'heal':
                            player.health = Math.min(player.maxHealth, player.health + 30);
                            healEffects.push(new HealEffect(player.x, player.y - 30, player.isLeft));
                            break;
                        case 'laser':
                            player.laserAmmo += 3;
                            break;
                        case 'shield':
                            player.shieldActive = true;
                            player.shieldTimer = 600; // 10秒
                            player.shieldHealth = player.shieldMaxHealth;
                            break;
                    }
                }

                // 检查P1
                const dx1 = p.x - player1.x;
                const dy1 = (p.y + Math.sin(p.floatPhase) * 5) - player1.y;
                if (dx1 * dx1 + dy1 * dy1 < (p.radius + 38) * (p.radius + 38)) {
                    p.collected = true;
                    applyPowerUp(player1, p.puType);
                    powerUps.splice(i, 1);
                    playPowerUpSound();
                    continue;
                }

                // 检查P2（AI也能捡道具）
                const dx2 = p.x - player2.x;
                const dy2 = (p.y + Math.sin(p.floatPhase) * 5) - player2.y;
                if (dx2 * dx2 + dy2 * dy2 < (p.radius + 38) * (p.radius + 38)) {
                    p.collected = true;
                    applyPowerUp(player2, p.puType);
                    powerUps.splice(i, 1);
                    playPowerUpSound();
                }
            }
        }

        function endRound(winner) {
            gameRunning = false;
            const winnerColor = winner === 1 ? '#ff8844' : '#44ccff';

            const winnerEl = document.getElementById('winner');
            const finalScoreEl = document.getElementById('finalScore');

            if (winner === 1) {
                // 玩家赢了
                winnerEl.textContent = '🔴 烈焰战机 获胜！';
                finalScoreEl.textContent = `比分：烈焰战机 ${roundScores[0]} : ${roundScores[1]} 寒冰战机`;
            } else {
                // 玩家输了 — 侮辱性弹窗
                const insults = [
                    '废物，洗洗睡吧',
                    '别玩了，你不适合这个游戏',
                    '就这？回去再练十年吧',
                    '手残党建议退游',
                    '菜得抠脚，卸载吧'
                ];
                const insult = insults[Math.floor(Math.random() * insults.length)];
                winnerEl.textContent = insult;
                finalScoreEl.textContent = `比分：烈焰战机 ${roundScores[0]} : ${roundScores[1]} 寒冰战机 — 丢人现眼`;
            }

            winnerEl.style.color = winnerColor;
            document.getElementById('gameOverScreen').style.display = 'flex';
        }

        function drawStars() {
            stars.forEach(s => {
                s.y += s.speed;
                if (s.y > canvas.height) {
                    s.y = 0;
                    s.x = Math.random() * canvas.width;
                }

                const twinkle = Math.sin(Date.now() * 0.003 + s.x) * 0.3 + 0.7;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${s.brightness * twinkle})`;
                ctx.fill();
            });
        }

        function gameLoop() {
            if (!gameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawStars();

            // 障碍物绘制（在玩家下方）
            obstacles.forEach(obs => {
                if (obs.type === 'wall' && obs.health > 0) {
                    obs.update();
                    obs.draw();
                }
            });
            obstacles.forEach(obs => {
                if (obs.type === 'trap') {
                    obs.update();
                    obs.draw();
                }
            });

            player1.update();
            player2.updateAI(player1);
            player2.update();

            // 处理玩家与固体障碍物的碰撞
            resolvePlayerObstacleCollision(player1);
            resolvePlayerObstacleCollision(player2);

            checkCollisions();
            updateHealthBars();

            // 道具生成（每8秒左右生成一个）
            powerUpSpawnTimer++;
            if (powerUpSpawnTimer >= 480) {
                powerUpSpawnTimer = 0;
                powerUps.push(new PowerUp(
                    100 + Math.random() * (canvas.width - 200),
                    -30
                ));
            }

            // 道具更新和绘制
            for (let i = powerUps.length - 1; i >= 0; i--) {
                powerUps[i].update();
                powerUps[i].draw();
                if (powerUps[i].life <= 0 || powerUps[i].collected) {
                    powerUps.splice(i, 1);
                }
            }

            player1.draw();
            player2.draw();

            // 绘制武器状态提示
            drawWeaponStatus();

            // 清理已摧毁的障碍物
            for (let i = obstacles.length - 1; i >= 0; i--) {
                if (obstacles[i].type === 'wall' && obstacles[i].health <= 0) {
                    obstacles.splice(i, 1);
                }
            }

            // 爆炸效果
            for (let i = explosions.length - 1; i >= 0; i--) {
                explosions[i].update();
                explosions[i].draw();
                if (explosions[i].life <= 0) {
                    explosions.splice(i, 1);
                }
            }

            // 回血特效
            for (let i = healEffects.length - 1; i >= 0; i--) {
                healEffects[i].update();
                healEffects[i].draw();
                if (healEffects[i].life <= 0) {
                    healEffects.splice(i, 1);
                }
            }

            animationId = requestAnimationFrame(gameLoop);
        }

        function drawWeaponStatus() {
            const statuses1 = [];
            const statuses2 = [];

            if (player1.shotgunMode > 0) statuses1.push(`💥散弹x${player1.shotgunMode}`);
            if (player1.missileAmmo > 0) statuses1.push(`🚀导弹x${player1.missileAmmo}`);
            if (player1.laserAmmo > 0) statuses1.push(`☄️激光x${player1.laserAmmo}`);
            if (player1.shieldActive) statuses1.push(`🛡️护盾`);

            if (player2.shotgunMode > 0) statuses2.push(`💥散弹x${player2.shotgunMode}`);
            if (player2.missileAmmo > 0) statuses2.push(`🚀导弹x${player2.missileAmmo}`);
            if (player2.laserAmmo > 0) statuses2.push(`☄️激光x${player2.laserAmmo}`);
            if (player2.shieldActive) statuses2.push(`🛡️护盾`);

            // P1武器状态
            if (statuses1.length > 0) {
                ctx.save();
                ctx.fillStyle = 'rgba(255, 200, 100, 0.95)';
                ctx.font = 'bold 14px Microsoft YaHei';
                ctx.textAlign = 'left';
                ctx.shadowBlur = 8;
                ctx.shadowColor = 'rgba(255, 150, 0, 0.5)';
                const text = statuses1.join('  ');
                ctx.fillText(text, 20, canvas.height - 20);
                ctx.restore();
            }

            // P2武器状态
            if (statuses2.length > 0) {
                ctx.save();
                ctx.fillStyle = 'rgba(150, 210, 255, 0.95)';
                ctx.font = 'bold 14px Microsoft YaHei';
                ctx.textAlign = 'right';
                ctx.shadowBlur = 8;
                ctx.shadowColor = 'rgba(50, 150, 255, 0.5)';
                const text = statuses2.join('  ');
                ctx.fillText(text, canvas.width - 20, canvas.height - 20);
                ctx.restore();
            }
        }

        function startGame() {
            initAudio();
            document.getElementById('startScreen').style.display = 'none';
            initGame();
            gameRunning = true;
            gameLoop();
        }

        function restartGame() {
            initAudio();
            document.getElementById('gameOverScreen').style.display = 'none';
            initGame();
            gameRunning = true;
            gameLoop();
        }

        // 键盘事件（仅P1使用）
        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;

            if (e.code === 'Space') {
                e.preventDefault();
                if (gameRunning) player1.shoot();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        // 窗口调整
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
