<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 星际大战 - Space Battle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a1a;
            overflow: hidden;
            font-family: 'Microsoft YaHei', sans-serif;
            color: #fff;
        }

        #gameCanvas {
            display: block;
            background: radial-gradient(ellipse at center, #1a1a3a 0%, #0a0a1a 100%);
        }

        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
        }

        .health-bar {
            position: absolute;
            top: 20px;
            width: 300px;
            height: 30px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.3);
        }

        .health-bar-left {
            left: 20px;
        }

        .health-bar-right {
            right: 20px;
        }

        .health-fill {
            height: 100%;
            transition: width 0.3s ease;
            border-radius: 13px;
        }

        .health-bar-left .health-fill {
            background: linear-gradient(90deg, #ff4444, #ff8844);
            width: 100%;
        }

        .health-bar-right .health-fill {
            background: linear-gradient(90deg, #4444ff, #44ccff);
            width: 100%;
            float: right;
        }

        .player-name {
            position: absolute;
            top: 55px;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 10px currentColor;
        }

        .player-name-left {
            left: 20px;
            color: #ff8844;
        }

        .player-name-right {
            right: 20px;
            color: #44ccff;
            text-align: right;
        }

        .score {
            position: absolute;
            top: 80px;
            font-size: 14px;
            opacity: 0.8;
        }

        .score-left {
            left: 20px;
            color: #ffaa66;
        }

        .score-right {
            right: 20px;
            color: #66ccff;
            text-align: right;
        }

        #startScreen, #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.85);
            z-index: 100;
        }

        #gameOverScreen {
            display: none;
        }

        h1 {
            font-size: 64px;
            margin-bottom: 20px;
            text-shadow: 0 0 30px #ff6600, 0 0 60px #ff3300;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .subtitle {
            font-size: 20px;
            margin-bottom: 40px;
            opacity: 0.8;
        }

        .controls {
            display: flex;
            gap: 60px;
            margin-bottom: 40px;
        }

        .control-panel {
            background: rgba(255,255,255,0.05);
            padding: 25px 35px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            min-width: 220px;
        }

        .control-panel h3 {
            margin-bottom: 15px;
            font-size: 20px;
        }

        .control-panel.red h3 { color: #ff8844; }
        .control-panel.blue h3 { color: #44ccff; }

        .control-panel p {
            font-size: 15px;
            line-height: 2;
            opacity: 0.85;
        }

        .key {
            display: inline-block;
            background: rgba(255,255,255,0.15);
            padding: 3px 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 14px;
            margin: 0 3px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        button {
            padding: 18px 60px;
            font-size: 24px;
            background: linear-gradient(135deg, #ff6600, #ff3300);
            color: #fff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            pointer-events: all;
            transition: all 0.3s ease;
            font-weight: bold;
            letter-spacing: 2px;
            box-shadow: 0 0 30px rgba(255, 102, 0, 0.4);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 40px rgba(255, 102, 0, 0.6);
        }

        #winner {
            font-size: 48px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px currentColor;
        }

        #finalScore {
            font-size: 24px;
            margin-bottom: 30px;
            opacity: 0.8;
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="ui">
        <div class="health-bar health-bar-left">
            <div class="health-fill" id="health1"></div>
        </div>
        <div class="health-bar health-bar-right">
            <div class="health-fill" id="health2"></div>
        </div>
        <div class="player-name player-name-left">🔴 烈焰战机</div>
        <div class="player-name player-name-right">🔵 寒冰战机</div>
        <div class="score score-left">击杀: <span id="score1">0</span></div>
        <div class="score score-right">击杀: <span id="score2">0</span></div>
    </div>

    <div id="startScreen">
        <h1>🚀 星际大战</h1>
        <p class="subtitle">双人对战射击游戏 — 决出宇宙最强飞行员！</p>
        <div class="controls">
            <div class="control-panel red">
                <h3>🔴 烈焰战机 (P1)</h3>
                <p><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> 移动</p>
                <p><span class="key">空格</span> 射击</p>
            </div>
            <div class="control-panel blue">
                <h3>🔵 寒冰战机 (P2)</h3>
                <p><span class="key">↑</span><span class="key">↓</span><span class="key">←</span><span class="key">→</span> 移动</p>
                <p><span class="key">回车</span> 射击</p>
            </div>
        </div>
        <button onclick="startGame()">开始战斗</button>
    </div>

    <div id="gameOverScreen">
        <div id="winner"></div>
        <div id="finalScore"></div>
        <button onclick="restartGame()">再来一局</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // 游戏状态
        let gameRunning = false;
        let animationId;
        let roundScores = [0, 0];

        // 星星背景
        const stars = [];
        for (let i = 0; i < 150; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 0.5,
                speed: Math.random() * 0.5 + 0.2,
                brightness: Math.random()
            });
        }

        // 按键状态
        const keys = {};

        // 玩家
        class Player {
            constructor(x, y, color, isLeft) {
                this.x = x;
                this.y = y;
                this.width = 50;
                this.height = 50;
                this.color = color;
                this.isLeft = isLeft;
                this.speed = 5;
                this.maxHealth = 100;
                this.health = 100;
                this.bullets = [];
                this.lastShot = 0;
                this.shootCooldown = 250;
                this.angle = isLeft ? 0 : Math.PI;
                this.invincible = 0;
                this.engines = [];
            }

            update() {
                // 引擎粒子
                this.engines.push({
                    x: this.x + (this.isLeft ? -20 : 20),
                    y: this.y,
                    vx: (Math.random() - 0.5) * 2 + (this.isLeft ? -3 : 3),
                    vy: (Math.random() - 0.5) * 2,
                    life: 20,
                    maxLife: 20,
                    size: Math.random() * 6 + 3
                });

                for (let i = this.engines.length - 1; i >= 0; i--) {
                    const p = this.engines[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life--;
                    if (p.life <= 0) this.engines.splice(i, 1);
                }

                // 移动
                if (this.isLeft) {
                    if (keys['KeyW'] || keys['Keyw']) this.y -= this.speed;
                    if (keys['KeyS'] || keys['Keys']) this.y += this.speed;
                    if (keys['KeyA'] || keys['Keya']) this.x -= this.speed;
                    if (keys['KeyD'] || keys['Keyd']) this.x += this.speed;
                } else {
                    if (keys['ArrowUp']) this.y -= this.speed;
                    if (keys['ArrowDown']) this.y += this.speed;
                    if (keys['ArrowLeft']) this.x -= this.speed;
                    if (keys['ArrowRight']) this.x += this.speed;
                }

                // 边界
                this.x = Math.max(30, Math.min(canvas.width - 30, this.x));
                this.y = Math.max(30, Math.min(canvas.height - 30, this.y));

                // 更新子弹
                for (let i = this.bullets.length - 1; i >= 0; i--) {
                    const b = this.bullets[i];
                    b.x += b.vx;
                    b.y += b.vy;
                    b.life--;

                    if (b.life <= 0 || b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                        this.bullets.splice(i, 1);
                    }
                }

                if (this.invincible > 0) this.invincible--;
            }

            draw() {
                // 无敌闪烁
                if (this.invincible > 0 && Math.floor(this.invincible / 5) % 2 === 0) return;

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.isLeft ? 0 : Math.PI);

                // 飞船主体
                ctx.beginPath();
                ctx.moveTo(25, 0);
                ctx.lineTo(-15, -20);
                ctx.lineTo(-10, -10);
                ctx.lineTo(-20, -10);
                ctx.lineTo(-20, 10);
                ctx.lineTo(-10, 10);
                ctx.lineTo(-15, 20);
                ctx.closePath();

                const gradient = ctx.createLinearGradient(-20, 0, 25, 0);
                gradient.addColorStop(0, this.color);
                gradient.addColorStop(1, this.isLeft ? '#ff6644' : '#44aaff');
                ctx.fillStyle = gradient;
                ctx.fill();
                ctx.strokeStyle = this.isLeft ? '#ffaa66' : '#66ccff';
                ctx.lineWidth = 2;
                ctx.stroke();

                // 驾驶舱
                ctx.beginPath();
                ctx.ellipse(5, 0, 8, 5, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
                ctx.fillStyle = this.isLeft ? '#ff6600' : '#0088ff';
                ctx.beginPath();
                ctx.ellipse(5, 0, 5, 3, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();

                // 引擎粒子
                this.engines.forEach(p => {
                    const alpha = p.life / p.maxLife;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
                    ctx.fillStyle = this.isLeft
                        ? `rgba(255, 100, 50, ${alpha})`
                        : `rgba(50, 150, 255, ${alpha})`;
                    ctx.fill();
                });

                // 子弹
                this.bullets.forEach(b => {
                    ctx.save();
                    ctx.translate(b.x, b.y);
                    ctx.rotate(b.angle);

                    // 子弹发光效果
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = this.isLeft ? '#ff6600' : '#0088ff';

                    ctx.beginPath();
                    ctx.ellipse(0, 0, 12, 4, 0, 0, Math.PI * 2);
                    ctx.fillStyle = this.isLeft ? '#ff8844' : '#44aaff';
                    ctx.fill();

                    ctx.beginPath();
                    ctx.ellipse(2, 0, 6, 2, 0, 0, Math.PI * 2);
                    ctx.fillStyle = '#fff';
                    ctx.fill();

                    ctx.restore();
                });
            }

            shoot() {
                const now = Date.now();
                if (now - this.lastShot < this.shootCooldown) return;
                this.lastShot = now;

                const angle = this.isLeft ? 0 : Math.PI;
                const speed = 10;
                this.bullets.push({
                    x: this.x + (this.isLeft ? 30 : -30),
                    y: this.y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    angle: angle,
                    life: 80,
                    damage: 10
                });
            }
        }

        // 爆炸效果
        class Explosion {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.particles = [];
                this.life = 40;

                for (let i = 0; i < 30; i++) {
                    const angle = (Math.PI * 2 / 30) * i + Math.random() * 0.5;
                    const speed = Math.random() * 5 + 2;
                    this.particles.push({
                        x: 0, y: 0,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        size: Math.random() * 5 + 2,
                        life: Math.random() * 30 + 20
                    });
                }
            }

            update() {
                this.life--;
                this.particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vx *= 0.95;
                    p.vy *= 0.95;
                    p.life--;
                    p.size *= 0.97;
                });
            }

            draw() {
                this.particles.forEach(p => {
                    if (p.life <= 0) return;
                    const alpha = p.life / 40;
                    ctx.beginPath();
                    ctx.arc(this.x + p.x, this.y + p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${this.color}, ${alpha})`;
                    ctx.fill();
                });
            }
        }

        // 击中效果
        function drawHitEffect(x, y, color) {
            for (let i = 0; i < 8; i++) {
                const angle = (Math.PI * 2 / 8) * i;
                const dist = Math.random() * 15 + 5;
                ctx.beginPath();
                ctx.arc(x + Math.cos(angle) * dist, y + Math.sin(angle) * dist, Math.random() * 3 + 1, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.fill();
            }
        }

        // 玩家实例
        let player1, player2;
        let explosions = [];

        function initGame() {
            player1 = new Player(canvas.width * 0.2, canvas.height / 2, '#ff4444', true);
            player2 = new Player(canvas.width * 0.8, canvas.height / 2, '#4444ff', false);
            explosions = [];
        }

        function updateHealthBars() {
            document.getElementById('health1').style.width = player1.health + '%';
            document.getElementById('health2').style.width = player2.health + '%';
        }

        function checkCollisions() {
            // 玩家1的子弹击中玩家2
            for (let i = player1.bullets.length - 1; i >= 0; i--) {
                const b = player1.bullets[i];
                const dx = b.x - player2.x;
                const dy = b.y - player2.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 30 && player2.invincible <= 0) {
                    player2.health -= b.damage;
                    player1.bullets.splice(i, 1);
                    drawHitEffect(b.x, b.y, '#4488ff');

                    // 击退
                    player2.x += 5;

                    if (player2.health <= 0) {
                        explosions.push(new Explosion(player2.x, player2.y, '255, 150, 50'));
                        roundScores[0]++;
                        document.getElementById('score1').textContent = roundScores[0];
                        endRound(1);
                        return;
                    }
                }
            }

            // 玩家2的子弹击中玩家1
            for (let i = player2.bullets.length - 1; i >= 0; i--) {
                const b = player2.bullets[i];
                const dx = b.x - player1.x;
                const dy = b.y - player1.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 30 && player1.invincible <= 0) {
                    player1.health -= b.damage;
                    player2.bullets.splice(i, 1);
                    drawHitEffect(b.x, b.y, '#ff6644');

                    // 击退
                    player1.x -= 5;

                    if (player1.health <= 0) {
                        explosions.push(new Explosion(player1.x, player1.y, '50, 150, 255'));
                        roundScores[1]++;
                        document.getElementById('score2').textContent = roundScores[1];
                        endRound(2);
                        return;
                    }
                }
            }
        }

        function endRound(winner) {
            gameRunning = false;
            const winnerName = winner === 1 ? '🔴 烈焰战机' : '🔵 寒冰战机';
            const winnerColor = winner === 1 ? '#ff8844' : '#44ccff';

            document.getElementById('winner').textContent = winnerName + ' 获胜！';
            document.getElementById('winner').style.color = winnerColor;
            document.getElementById('finalScore').textContent =
                `比分：烈焰战机 ${roundScores[0]} : ${roundScores[1]} 寒冰战机`;
            document.getElementById('gameOverScreen').style.display = 'flex';
        }

        function drawStars() {
            stars.forEach(s => {
                s.y += s.speed;
                if (s.y > canvas.height) {
                    s.y = 0;
                    s.x = Math.random() * canvas.width;
                }

                const twinkle = Math.sin(Date.now() * 0.003 + s.x) * 0.3 + 0.7;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${s.brightness * twinkle})`;
                ctx.fill();
            });
        }

        function gameLoop() {
            if (!gameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawStars();

            player1.update();
            player2.update();
            checkCollisions();
            updateHealthBars();

            player1.draw();
            player2.draw();

            // 爆炸效果
            for (let i = explosions.length - 1; i >= 0; i--) {
                explosions[i].update();
                explosions[i].draw();
                if (explosions[i].life <= 0) {
                    explosions.splice(i, 1);
                }
            }

            animationId = requestAnimationFrame(gameLoop);
        }

        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            initGame();
            gameRunning = true;
            gameLoop();
        }

        function restartGame() {
            document.getElementById('gameOverScreen').style.display = 'none';
            initGame();
            gameRunning = true;
            gameLoop();
        }

        // 键盘事件
        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;

            if (e.code === 'Space') {
                e.preventDefault();
                if (gameRunning) player1.shoot();
            }
            if (e.code === 'Enter') {
                e.preventDefault();
                if (gameRunning) player2.shoot();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        // 窗口调整
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
